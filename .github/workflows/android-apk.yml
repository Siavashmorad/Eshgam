name: Eshgam Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org ir.eshgam .
      - name: Apply build compatibility fixes
        run: |
          rm -rf test
          if ! tail -n 5 lib/main.dart | grep -q '^}$'; then printf '\n}\n' >> lib/main.dart; fi
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eshgam-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

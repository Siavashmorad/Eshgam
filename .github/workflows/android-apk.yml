name: Eshgam Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org ir.eshgam .
      - name: Apply Android build fixes
        run: |
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1) if 'isCoreLibraryDesugaringEnabled = true' not in s else s
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              m = re.search(r'(?m)^dependencies\\s*\\{', s)
              if not m:
                  raise SystemExit('No dependencies block found in android/app/build.gradle.kts')
              insert_at = m.end()
              s = s[:insert_at] + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' + s[insert_at:]
          p.write_text(s)
          print('--- android/app/build.gradle.kts ---')
          print(s)
          print('--- desugaring check ---')
          assert 'isCoreLibraryDesugaringEnabled = true' in s
          assert 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' in s
          print('DESUGARING_CONFIG_OK')
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eshgam-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

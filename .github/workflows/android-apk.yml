name: Eshgam Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org ir.eshgam .

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/build.gradle.kts')
          s = p.read_text()

          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              marker = 'compileOptions {'
              if marker not in s:
                  raise SystemExit('compileOptions block not found')
              s = s.replace(marker, marker + '\n        isCoreLibraryDesugaringEnabled = true', 1)

          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dep not in s:
              marker = '\ndependencies {'
              if marker in s:
                  s = s.replace(marker, marker + '\n    ' + dep, 1)
              else:
                  s = s.rstrip() + '\n\ndependencies {\n    ' + dep + '\n}\n'

          p.write_text(s)
          print(s)
          assert 'isCoreLibraryDesugaringEnabled = true' in s
          assert dep in s
          print('DESUGARING_CONFIG_OK')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest ', '<manifest ', 1)
              s = s.replace('>\n', '>\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n', 1)
          s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1) if 'android:usesCleartextTraffic=' not in s else s
          p.write_text(s)
          print('LOCAL_NETWORK_MANIFEST_OK')
          PY

      - name: Enable local offline/LAN mode
        run: python3 tool/enable_local_mode.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eshgam-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

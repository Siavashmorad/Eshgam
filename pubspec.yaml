name: eshgam
description: Eshgam - private two-person romantic messenger.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^0.14.1
  image_picker: ^1.1.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
